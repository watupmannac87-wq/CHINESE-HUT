<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#241a20" />
      <stop offset="60%" stop-color="#141419" />
      <stop offset="100%" stop-color="#0b0c10" />
    </radialGradient>
    <radialGradient id="flameGrad" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#e11d48" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Ambient Glow -->
  <circle cx="400" cy="300" r="220" fill="url(#flameGrad)" />

  <!-- Outer Wok / Plate Silhouette -->
  <circle cx="400" cy="320" r="160" fill="#1b1c24" stroke="#2e303d" stroke-width="4" />
  <circle cx="400" cy="320" r="135" fill="#15161d" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6" />

  <!-- Chopsticks Graphic -->
  <line x1="320" y1="180" x2="480" y2="440" stroke="#f59e0b" stroke-width="7" stroke-linecap="round" opacity="0.85" />
  <line x1="350" y1="175" x2="495" y2="430" stroke="#fcd34d" stroke-width="5" stroke-linecap="round" opacity="0.8" />

  <!-- Center Chinese Hut Brand Motif -->
  <g transform="translate(400, 310)" text-anchor="middle" filter="url(#glow)">
    <!-- Stylized Bowl Icon -->
    <path d="M -50 0 Q 0 45 50 0 Z" fill="#e11d48" />
    <path d="M -45 -6 Q -20 -30 -10 -10 Q 0 -35 15 -10 Q 30 -30 45 -6" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Title & Subtitle -->
  <text x="400" y="440" text-anchor="middle" font-family="'Outfit', -apple-system, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="3">
    CHINESE <tspan fill="#e11d48">HUT</tspan>
  </text>
  <text x="400" y="470" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#a1a1aa" letter-spacing="1.5">
    FRESH WOK SPECIALS · TALEGAON DABHADE
  </text>
</svg>
